[workspace]
resolver = "2"
members = [
    "crates/noisy_core",
    "crates/noisy_ffi",
    "crates/engine",
    "crates/testplugin",
    "crates/badplugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
mlua = { version = "0.10", default-features = false, features = ["lua54", "vendored"] }
libloading = "0.8"
toml = "0.9"

[profile.release]
panic = "unwind"
