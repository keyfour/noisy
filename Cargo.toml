[workspace]
resolver = "2"
members = ["crates/noisy_core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "1"
mlua = { version = "0.10", default-features = false, features = ["lua54", "vendored"] }

[profile.release]
panic = "unwind"
