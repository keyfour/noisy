name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: tests (single thread)
        run: cargo test -- --test-threads=1

      - name: tests (parallel)
        run: cargo test

  cpp:
    name: cpp sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: pinned compiler (g++-13)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-13

      # Pinned dependency acquisition (specification §7): idempotent,
      # sha256-verified; a no-op when the vendored file is up to date.
      - name: vendor dependencies
        run: scripts/bash/vendor_deps.sh

      - name: build examples (warnings as errors)
        run: env CXX=g++-13 scripts/bash/build_cpp_examples.sh
